<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">把手机当作触控板</title><desc id="desc">默认触控板模式；也可选择直接点按。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#607c8c" stroke-width="1.4"/></marker></defs><rect width="1200" height="400" rx="22" fill="#f2f7fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="40" y="47" fill="#243e50" font-size="23" font-weight="600">把手机当作触控板</text><rect x="40" y="90" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="83" cy="135" r="18" fill="#e5eff5"/><text x="77" y="141" fill="#243e50" font-size="17" font-weight="600">1</text><text x="122" y="133" fill="#243e50" font-size="21" font-weight="600">滑动</text><text x="122" y="164" fill="#607c8c" font-size="16" font-weight="400">移动光标</text><rect x="430" y="90" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="473" cy="135" r="18" fill="#e5eff5"/><text x="467" y="141" fill="#243e50" font-size="17" font-weight="600">2</text><text x="512" y="133" fill="#243e50" font-size="21" font-weight="600">轻点</text><text x="512" y="164" fill="#607c8c" font-size="16" font-weight="400">单击</text><rect x="820" y="90" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="863" cy="135" r="18" fill="#e5eff5"/><text x="857" y="141" fill="#243e50" font-size="17" font-weight="600">3</text><text x="902" y="133" fill="#243e50" font-size="21" font-weight="600">双击</text><text x="902" y="164" fill="#607c8c" font-size="16" font-weight="400">连续两次轻点</text><rect x="40" y="220" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="83" cy="265" r="18" fill="#e5eff5"/><text x="77" y="271" fill="#243e50" font-size="17" font-weight="600">4</text><text x="122" y="263" fill="#243e50" font-size="21" font-weight="600">连点后按住</text><text x="122" y="294" fill="#607c8c" font-size="16" font-weight="400">拖拽</text><rect x="430" y="220" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="473" cy="265" r="18" fill="#e5eff5"/><text x="467" y="271" fill="#243e50" font-size="17" font-weight="600">5</text><text x="512" y="263" fill="#243e50" font-size="21" font-weight="600">双指</text><text x="512" y="294" fill="#607c8c" font-size="16" font-weight="400">缩放与平移</text><rect x="820" y="220" width="340" height="108" rx="16" fill="white" stroke="#b7ccd8"/><circle cx="863" cy="265" r="18" fill="#e5eff5"/><text x="857" y="271" fill="#243e50" font-size="17" font-weight="600">6</text><text x="902" y="263" fill="#243e50" font-size="21" font-weight="600">输入文字</text><text x="902" y="294" fill="#607c8c" font-size="16" font-weight="400">打开键盘</text><text x="40" y="376" fill="#607c8c" font-size="14" font-weight="400">默认触控板模式；也可选择直接点按。</text></g></svg>

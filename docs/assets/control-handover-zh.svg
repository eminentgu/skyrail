<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">画面不断，控制权清晰交接</title><desc id="desc">租约只协调 Skyrail 路径，不隔离其他客户端或物理输入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#607c8c" stroke-width="1.4"/></marker></defs><rect width="1200" height="370" rx="22" fill="#f2f7fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="40" y="47" fill="#243e50" font-size="23" font-weight="600">画面不断，控制权清晰交接</text><rect x="40" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="64" y="132" fill="#607c8c" font-size="13" font-weight="600">01</text><text x="64" y="170" fill="#243e50" font-size="22" font-weight="600">人工操作</text><text x="64" y="200" fill="#607c8c" font-size="16" font-weight="400">同一桌面连接</text><text x="64" y="225" fill="#607c8c" font-size="16" font-weight="400">键盘 / 指针输入开启</text><rect x="430" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="454" y="132" fill="#607c8c" font-size="13" font-weight="600">02</text><text x="454" y="170" fill="#243e50" font-size="22" font-weight="600">交给 Codex</text><text x="454" y="200" fill="#607c8c" font-size="16" font-weight="400">画面继续 · 人工输入暂停</text><text x="454" y="225" fill="#607c8c" font-size="16" font-weight="400">模型走独立的应用工具</text><rect x="820" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="844" y="132" fill="#607c8c" font-size="13" font-weight="600">03</text><text x="844" y="170" fill="#243e50" font-size="22" font-weight="600">接手操作</text><text x="844" y="200" fill="#607c8c" font-size="16" font-weight="400">先撤销模型控制</text><text x="844" y="225" fill="#607c8c" font-size="16" font-weight="400">再恢复人工键鼠输入</text><path d="M385 184H420" stroke="#607c8c" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M775 184H810" stroke="#607c8c" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="346" fill="#607c8c" font-size="14" font-weight="400">租约只协调 Skyrail 路径，不隔离其他客户端或物理输入。</text></g></svg>

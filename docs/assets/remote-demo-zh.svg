 <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="64" y="68" font-size="13" fill="#b7d5e9" font-weight="500" letter-spacing="2.5">SKYRAIL / REMOTE WORKSPACE</text><text x="64" y="116" font-size="35" fill="#f0f6fc" font-weight="550" >你的 Mac，远程也在眼前。</text><g transform="translate(1025 44)"><rect width="349" height="65" rx="18" fill="url(#glass)" stroke="#d6e6f4" stroke-opacity=".22"/><rect x="19" y="17" width="35" height="24" rx="4" fill="none" stroke="#c7ddef" stroke-width="1.5"/><path d="M29 47h16m-8-6v6" stroke="#c7ddef" stroke-width="1.5"/><text x="72" y="28" font-size="14" fill="#ecf6ff" font-weight="500" >本地 Mac</text><text x="72" y="48" font-size="11" fill="#adc7db" font-weight="400" >Codex · projects · sessions</text></g><g filter="url(#shadow)"><rect x="64" y="160" width="1135" height="635" rx="20" fill="#122331" fill-opacity=".83" stroke="#d4e8f6" stroke-opacity=".28"/><path d="M84 160h1095a20 20 0 0 1 20 20v33H64v-33a20 20 0 0 1 20-20" fill="url(#glass)"/><circle cx="86" cy="186" r="4" fill="#e3c1b9"/><circle cx="102" cy="186" r="4" fill="#ddd6b9"/><circle cx="118" cy="186" r="4" fill="#b4d4c9"/><rect x="375" y="171" width="500" height="30" rx="9" fill="#0c1d2c" fill-opacity=".45"/><text x="555" y="191" font-size="11" fill="#b3cada" font-weight="400" >your-private-gateway / skyrail</text><path d="m93 236 12-16m-4 16 12-16m-23 10h8" stroke="#e7f3fb" stroke-width="2.3" stroke-linecap="round"/><text x="124" y="237" font-size="18" fill="#eff7ff" font-weight="600" >Skyrail</text><text x="1040" y="237" font-size="9" fill="#b1cdde" font-weight="500" letter-spacing="1.5">REMOTE / DEMO</text><path d="M64 254h1135" stroke="#b9d9ed" stroke-opacity=".13"/><text x="92" y="290" font-size="14" fill="#f0f6fb" font-weight="500" >项目交付 · 原 Codex 会话</text><text x="92" y="315" font-size="11" fill="#8eabba" font-weight="400" >~/projects/skyrail</text><rect x="89" y="345" width="318" height="68" rx="14" fill="#b1d3ec" fill-opacity=".13" st
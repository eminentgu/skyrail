<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">远程 Computer Use 场景示意</title><desc id="desc">本地 Mac 上的 Codex 会话，在远程浏览器和手机中继续。界面为示例数据与场景插画，不代表实机直播。</desc><defs>

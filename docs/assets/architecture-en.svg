<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Two paths. Distinct responsibilities.</title><desc id="desc">Continuous viewing does not send every frame to the model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#607c8c" stroke-width="1.4"/></marker></defs><rect width="1200" height="440" rx="22" fill="#f2f7fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="40" y="47" fill="#243e50" font-size="23" font-weight="600">Two paths. Distinct responsibilities.</text><rect x="40" y="160" width="250" height="125" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="64" y="200" fill="#243e50" font-size="22" font-weight="600">Browser</text><text x="64" y="232" fill="#607c8c" font-size="16" font-weight="400">Live view · chat · takeover</text><rect x="365" y="160" width="250" height="125" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="389" y="200" fill="#243e50" font-size="22" font-weight="600">Skyrail local service</text><text x="389" y="232" fill="#607c8c" font-size="16" font-weight="400">Session &amp; control coordination</text><rect x="710" y="80" width="440" height="125" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="734" y="120" fill="#243e50" font-size="22" font-weight="600">Agent: selected application</text><text x="734" y="152" fill="#607c8c" font-size="16" font-weight="400">Codex → Swift / Accessibility</text><text x="734" y="177" fill="#607c8c" font-size="16" font-weight="400">On-demand observation &amp; app input</text><rect x="710" y="250" width="440" height="125" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="734" y="290" fill="#243e50" font-size="22" font-weight="600">Human: whole desktop</text><text x="734" y="322" fill="#607c8c" font-size="16" font-weight="400">noVNC → macOS Screen Sharing</text><text x="734" y="347" fill="#607c8c" font-size="16" font-weight="400">Separate login &amp; desktop input</text><path d="M295 222H357" stroke="#607c8c" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M615 222H660V142H702M660 222V312H702" stroke="#607c8c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="416" fill="#607c8c" font-size="14" font-weight="400">Continuous viewing does not send every frame to the model.</text></g></svg>

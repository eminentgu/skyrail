<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Permissions follow the capability.</title><desc id="desc">The full-access setting does not grant macOS system permissions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#607c8c" stroke-width="1.4"/></marker></defs><rect width="1200" height="370" rx="22" fill="#f2f7fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="40" y="47" fill="#243e50" font-size="23" font-weight="600">Permissions follow the capability.</text><rect x="40" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="64" y="132" fill="#607c8c" font-size="13" font-weight="600">01</text><text x="64" y="170" fill="#243e50" font-size="22" font-weight="600">Interface &amp; text tasks</text><text x="64" y="200" fill="#607c8c" font-size="16" font-weight="400">No GUI permission required</text><text x="64" y="225" fill="#607c8c" font-size="16" font-weight="400">Real tasks need Codex sign-in</text><rect x="430" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="454" y="132" fill="#607c8c" font-size="13" font-weight="600">02</text><text x="454" y="170" fill="#243e50" font-size="22" font-weight="600">Agent app control</text><text x="454" y="200" fill="#607c8c" font-size="16" font-weight="400">Skyrail Mac native helper</text><text x="454" y="225" fill="#607c8c" font-size="16" font-weight="400">Accessibility + Screen Recording</text><rect x="820" y="94" width="340" height="180" rx="18" fill="#fff" stroke="#b7ccd8"/><text x="844" y="132" fill="#607c8c" font-size="13" font-weight="600">03</text><text x="844" y="170" fill="#243e50" font-size="22" font-weight="600">Manual whole desktop</text><text x="844" y="200" fill="#607c8c" font-size="16" font-weight="400">macOS Screen Sharing</text><text x="844" y="225" fill="#607c8c" font-size="16" font-weight="400">Your own Mac account login</text><text x="40" y="346" fill="#607c8c" font-size="14" font-weight="400">The full-access setting does not grant macOS system permissions.</text></g></svg>
